name: CI

# ⏸️ 27/09/2026: gatilhos automáticos PAUSADOS — cota Free do GitHub Actions da org esgotou.
# Padrão agora: `ci:local` antes do push (ver AI/NOTES). Para reativar, troque o bloco `on:` pelo original abaixo.
on:
  workflow_dispatch:
# --- gatilhos originais ---
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (strict typecheck)
        run: pnpm build:strict

      - name: Run tests
        run: node --test shared/dist/roundtrip.test.js
